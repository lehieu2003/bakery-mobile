name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    # PR-only rules (CONTRIBUTING.md); branch name + commits are also checked
    # by scripts/validate.sh in the test job.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PR source branch allowed for target
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "master" ]; then
            case "$HEAD" in
              release/*|hotfix/*|dev) ;;
              *) echo "::error::PR vào master chỉ từ release/*, hotfix/* (hoặc dev). Nhận: $HEAD"; exit 1 ;;
            esac
          fi

      - name: PR title (squash commit message)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/git-conventions.sh title "$TITLE"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PRs: test the branch head (validate.sh checks its commits/branch).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.4 # keep in sync with .fvmrc
          channel: stable
          cache: true

      - name: Gate (scripts/validate.sh)
        env:
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: bash scripts/validate.sh --base "origin/$BASE_REF"
